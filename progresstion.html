```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up Form</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        /* Center everything */
        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #0d6efd, #6f42c1);
        }

        /* Form card */
        .signup-card {
            width: 100%;
            max-width: 450px;

            border: none;
            border-radius: 20px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        /* Logo */
        .logo {
            width: 80px;
            height: 80px;

            margin: 0 auto 15px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            background-color: #0d6efd;
            color: white;

            font-size: 32px;
            font-weight: bold;
        }

        /* Button */
        .signup-btn {
            border-radius: 10px;
            padding: 12px;
            font-weight: bold;
        }

    </style>

</head>


<body>

    <!-- SIGN UP CARD -->
    <div class="card signup-card p-4">

        <div class="card-body">

            <!-- LOGO -->
            <div class="logo">
                S
            </div>

            <!-- TITLE -->
            <h2 class="text-center text-primary fw-bold">
                Create Account
            </h2>

            <p class="text-center text-muted mb-4">
                Sign up to get started
            </p>


            <!-- FORM -->
            <form id="signupForm">

                <!-- FULL NAME -->
                <div class="mb-3">

                    <label
                        for="name"
                        class="form-label"
                    >
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        class="form-control"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- EMAIL -->
                <div class="mb-3">

                    <label
                        for="email"
                        class="form-label"
                    >
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->
                <div class="mb-3">

                    <label
                        for="password"
                        class="form-label"
                    >
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->
                <div class="mb-3">

                    <label
                        for="confirmPassword"
                        class="form-label"
                    >
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        class="form-control"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- TERMS -->
                <div class="form-check mb-3">

                    <input
                        type="checkbox"
                        id="terms"
                        class="form-check-input"
                        required
                    >

                    <label
                        for="terms"
                        class="form-check-label"
                    >
                        I agree to the terms and conditions
                    </label>

                </div>


                <!-- SIGN UP -->
                <button
                    type="submit"
                    class="btn btn-primary w-100 signup-btn"
                >
                    Sign Up
                </button>

            </form>


            <!-- MESSAGE -->
            <div
                id="message"
                class="text-center mt-3"
            ></div>

        </div>

    </div>


    <!-- JAVASCRIPT -->
    <script>

        // Get the form
        const form =
            document.getElementById("signupForm");

        // Get the message area
        const message =
            document.getElementById("message");


        // Listen for form submission
        form.addEventListener("submit", function(event) {

            // Prevent page refresh
            event.preventDefault();


            // Get the values
            const name =
                document.getElementById("name").value.trim();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;


            // Check passwords
            if (password !== confirmPassword) {

                message.innerHTML = `
                    <div class="alert alert-danger">
                        Passwords do not match!
                    </div>
                `;

                return;
            }


            // Check password length
            if (password.length < 6) {

                message.innerHTML = `
                    <div class="alert alert-warning">
                        Password must be at least 6 characters.
                    </div>
                `;

                return;
            }


            // Success message
            message.innerHTML = `
                <div class="alert alert-success">
                    Welcome, ${name}! 🎉
                    <br>
                    Your account has been created successfully.
                </div>
            `;


            // Clear form
            form.reset();

        });

    </script>

</body>

</html>
```
